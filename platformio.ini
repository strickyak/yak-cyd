[platformio]
default_envs = demo1

[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions_os9.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen@0.0.0-alpha+sha.26b691b2c8

build_flags =
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DSUPPORT_TRANSACTIONS=1
    -DILI9341_DRIVER=1

; Demo 1: Multi-App Launcher Suite (src/demo1/)
[env:demo1]
build_src_filter = -<*> +<demo1/*>

; Demo 2: Second Standalone Firmware (src/demo2/)
[env:demo2]
build_src_filter = -<*> +<demo2/*>

; Lakatos OS: Resident Operating System & Fixed-Address Application Loader (src/lakatos/)
[env:lakatos]
board_build.partitions = partitions_lakatos.csv
build_src_filter = -<*> +<lakatos/*>
build_flags =
    ${env.build_flags}
    -Iinclude

